<!DOCTYPE html>
<html lang="en" xmlns:line-height="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name=viewport content='width=700'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIF Alarm Tracker</title>
    <link rel="icon" href="static/fire.gif" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        html,
        body {
            font-size: 1.25rem;
            background-color:{{color}};
        }

        #root {
            width: fit-content;
            height: 98vh;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            flex-flow: column;
        }

        #header {
            margin-bottom: 0.1rem;
            text-align: center;
            color:#ff0000;
            font-family:'Courier new';
        }


        #header>div:first-child {
            padding-right: 1rem;
            font-size: 2rem;
        }

        #header>div:nth-child(2) {

            font-size: 1rem;
            text-overflow: ellipsis;
        }

        #splash {
            text-align: center;
            color:#00ffff;
            font-family:'Courier new';
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.1rem;
            margin-bottom: 2rem;
        }

        #mainBody {
            flex: 1;
        }

        #summary {
            text-align: center;
            color:#ffff00;
            font-family:'Courier new';
            font-size: 1.75rem;
            cursor: pointer;
        }

        #alarms {
            text-align: center;
            color:#ffffff;
            font-family:'Courier new';
            font-size: 1rem;
            display: none;
        }
        #footer {
            margin-bottom: 3rem;
            text-align: center;
            color:#ff0000;
            font-family:'Courier new';
        }
        .third {
            width: 33%;
            display: inline-block;
        }
        #archive_page {
            margin-bottom: 1rem;
            margin-top: 1rem;
            text-align: center;
            color:#ffffff;
            font-size: 1rem;
            font-family:'Courier new';
        }
    </style>
</head>

<!-- ToDo: Inherit from a base template -->
<body>
    <div id="root" >
        <div id="header">
            <div>CIF Alarm Tracker</div>
        </div>
            <div id="splash">
                <div>Now for Windows 95!!!</div>
            </div>
        <div id="mainBody">
            <script type="text/javascript">
            function toggle(className, arrowID) {
                var element = document.getElementById(className);
                var arrow = document.getElementById(arrowID);
                if (element.style.display === "none"){
                    element.style.display = "block";
                    arrow.innerHTML = "+"
                } else {
                    element.style.display = "none";
                    arrow.innerHTML = ">"
                }
            }
          </script>
            {% for floor in floor_data %}
                  <div id="summary" onclick="toggle('{{floor.name}}', 'arrow_{{floor.name}}')">
                    <span id='arrow_{{floor.name}}'> ></span> {{floor.name}} - {{floor.summary}}
                  </div>
                    <div id='{{floor.name}}' style="text-align: center;color:#ffffff;font-family:'Courier new';font-size: 1rem;display: none;">
                        <p>{{floor.alarms_str | safe}}</p>
                    </div>
            {% endfor %}
            <div style="text-align: center;color:#ffffff;font-family:'Courier new';font-size: 1.75rem;">Total: {{total}}</div>
        </div>
        <div id="footer">
            <div id="add">
                Days since last alarm: {{days}}
            </div>
            {% for archive_page in archive %}
                <div class="third"><a id="archive_page" href="{{archive_page.url}}">{{archive_page.name}}</a></div>
            {% endfor %}
        </div>
    </div>
</div>

</body>
</html>
